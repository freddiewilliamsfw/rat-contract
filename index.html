/* Fonts: Shrikhand (Jonny Pinhorn) and Bricolage Grotesque (Mathieu Triay), SIL Open Font License 1.1 */
:root{
  --burrow:#2B1B24; --burrow-2:#36222E; --felt:#4A2839; --felt-edge:#6B3C55;
  --whisker:#FFF8F2; --pink:#F29CA8; --pink-deep:#E77F96; --cheese:#F7C548; --cheese-deep:#D9A21F;
  --fur:#B9AAB1; --fur-dim:#8E7D86; --red:#C42641; --ink:#2A1F26; --good:#8FD6A6;
  --display:'Shrikhand','Cooper Black',Georgia,serif;
  --ui:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --cw:clamp(54px,17.5vw,78px);
  --tw:clamp(40px,12.4vw,56px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--burrow);color:var(--whisker);font-family:var(--ui);-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{min-height:100dvh;-webkit-tap-highlight-color:transparent;font-size:16px;line-height:1.4}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--cheese);outline-offset:2px}
input,select{font:inherit}
#root{min-height:100dvh;display:flex;flex-direction:column}

/* ---------- shared pieces ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:52px;padding:0 22px;border-radius:999px;font-weight:700;font-size:17px;letter-spacing:.01em}
.btn-cheese{background:var(--cheese);color:var(--ink);box-shadow:0 3px 0 var(--cheese-deep)}
.btn-cheese:active{transform:translateY(2px);box-shadow:0 1px 0 var(--cheese-deep)}
.btn-cheese:disabled{opacity:.45;box-shadow:none}
.btn-line{border:2px solid var(--felt-edge);color:var(--whisker)}
.btn-small{min-height:40px;padding:0 16px;font-size:15px}
.field{width:100%;min-height:52px;border-radius:14px;border:2px solid var(--felt-edge);background:var(--burrow-2);color:var(--whisker);padding:0 16px;font-size:18px}
.field::placeholder{color:var(--fur-dim)}
.field:focus{border-color:var(--cheese);outline:none}
.muted{color:var(--fur)}
.rat{width:100%;height:100%;display:block}
.suit{width:1em;height:1em;display:inline-block;vertical-align:-.12em}
.card{display:block;width:var(--cw);height:calc(var(--cw)*1.4);filter:drop-shadow(0 2px 3px rgba(20,8,14,.45))}
.card .cf{fill:#FFFBF6;stroke:rgba(42,31,38,.18);stroke-width:1.2}
.card .ci{font-family:var(--ui);font-weight:800;font-size:28px;font-stretch:75%;letter-spacing:-.5px}
.card .ci.ten{font-size:24px;letter-spacing:-2px}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translateX(-50%);background:var(--whisker);color:var(--ink);padding:12px 18px;border-radius:14px;font-weight:600;z-index:60;max-width:min(92vw,420px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:toast 3.2s both}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}8%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}

/* ---------- home ---------- */
.home{flex:1;display:flex;flex-direction:column;padding:28px 22px calc(28px + var(--safe-b));max-width:480px;margin:0 auto;width:100%}
.title{font-family:var(--display);font-weight:400;color:var(--pink);font-size:clamp(48px,15vw,72px);line-height:.92;margin:8px 0 0;letter-spacing:-.01em;text-shadow:0 4px 0 #1B0F16}
.title span{display:block;color:var(--cheese);margin-left:.9em}
.fan{position:relative;height:clamp(170px,48vw,230px);margin:18px 0 6px}
.fan .card{position:absolute;left:50%;bottom:0;--cw:clamp(92px,28vw,128px);transform-origin:50% 120%}
.fan .card:nth-child(1){transform:translateX(-50%) rotate(-16deg) translateX(-52px)}
.fan .card:nth-child(2){transform:translateX(-50%) rotate(0deg) translateY(-8px)}
.fan .card:nth-child(3){transform:translateX(-50%) rotate(16deg) translateX(52px)}
.lede{font-size:17px;color:#EBDCE3;margin:26px 0 22px;max-width:36ch}
.stack{display:flex;flex-direction:column;gap:12px}
.joinrow{display:flex;gap:10px}
.joinrow .field{text-transform:uppercase;letter-spacing:.18em;font-weight:700}
.or{color:var(--fur);font-size:15px;margin:10px 0 0}
details.rules{margin-top:26px;border-top:2px solid var(--burrow-2);padding-top:14px}
details.rules summary{font-weight:700;cursor:pointer;color:var(--pink);font-size:17px;list-style:none}
details.rules summary::before{content:'+ ';color:var(--cheese)}
details[open].rules summary::before{content:'\2013  '}
details.rules ol{padding-left:20px;margin:12px 0 0;color:#E6D6DE}
details.rules li{margin:0 0 8px}

/* ---------- simple screens ---------- */
.screen{flex:1;display:flex;flex-direction:column;padding:24px 22px calc(24px + var(--safe-b));max-width:480px;margin:0 auto;width:100%}
.screen h2{font-family:var(--display);font-weight:400;color:var(--pink);font-size:34px;line-height:1;margin:10px 0 8px}
.screen p{margin:0 0 18px}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.peek{width:84px;height:84px;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.back-link{align-self:flex-start;color:var(--fur);font-size:15px;padding:8px 0}

/* ---------- lobby ---------- */
.lobby{flex:1;padding:18px 18px calc(110px + var(--safe-b));max-width:520px;margin:0 auto;width:100%}
.lobby-head{display:flex;gap:16px;align-items:center}
.qr{background:var(--whisker);border-radius:16px;padding:10px;width:132px;height:132px;flex:none}
.qr svg{display:block;width:100%;height:100%}
.room-code{font-family:var(--display);color:var(--cheese);font-size:40px;line-height:1;letter-spacing:.04em}
.lobby-head p{margin:4px 0 10px;font-size:15px;color:var(--fur)}
.section-h{font-family:var(--display);color:var(--pink);font-weight:400;font-size:24px;margin:26px 0 10px}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.plist li{display:flex;align-items:center;gap:12px;background:var(--burrow-2);border-radius:16px;padding:8px 10px 8px 8px;min-height:56px}
.plist .av{width:40px;height:40px;flex:none}
.plist .nm{flex:1;font-weight:700;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .tag{font-size:13px;color:var(--fur);font-weight:500;margin-left:6px}
.plist .ctl{display:flex;gap:2px}
.plist .ctl button{width:36px;height:36px;border-radius:10px;color:var(--fur);font-size:18px}
.plist .ctl button:active{background:var(--felt)}
.plist li.off{opacity:.55}
.empty-seat{border:2px dashed var(--felt-edge);background:none!important;color:var(--fur-dim);justify-content:center;font-size:15px}
.settings{display:flex;flex-direction:column;gap:10px}
.setting{display:flex;flex-direction:column;gap:6px;background:var(--burrow-2);border-radius:16px;padding:12px 14px}
.setting label{font-weight:700;font-size:15px}
.setting .hint{font-size:13px;color:var(--fur)}
.setting select{width:100%;min-height:44px;border-radius:10px;border:2px solid var(--felt-edge);background:var(--burrow);color:var(--whisker);padding:0 10px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch{position:relative;width:52px;height:30px;border-radius:999px;background:var(--felt-edge);flex:none;transition:background .15s}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--whisker);transition:transform .15s}
.switch[aria-checked=true]{background:var(--cheese)}
.switch[aria-checked=true]::after{transform:translateX(22px)}
.rules-sum{background:var(--burrow-2);border-radius:16px;padding:12px 14px;margin:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:15px}
.dock{position:fixed;left:0;right:0;bottom:0;padding:30px 18px calc(12px + var(--safe-b));background:linear-gradient(rgba(43,27,36,0),var(--burrow) 45%);display:flex;justify-content:center;z-index:5}
.dock .btn{width:100%;max-width:480px}
.dock-wait{display:flex;align-items:center;justify-content:center;gap:10px;margin:0;min-height:52px;font-weight:700;color:var(--fur)}
.dock-wait .mini{width:30px;height:30px;animation:bob 1.6s ease-in-out infinite}
.dock-note{position:absolute;top:-8px;left:0;right:0;text-align:center;font-size:14px;color:var(--fur)}

/* ---------- table ---------- */
.game{flex:1;display:flex;flex-direction:column;height:100dvh;overflow:hidden;max-width:560px;margin:0 auto;width:100%}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 12px 4px;flex:none}
.topbar .hand-no{font-weight:700;font-size:15px;line-height:1.1;white-space:nowrap}
.topbar .hand-no small{display:block;font-weight:500;color:var(--fur);font-size:13px}
.trumpchip{display:flex;align-items:center;gap:8px;margin:0 auto;background:var(--burrow-2);border-radius:999px;padding:4px 12px 4px 5px;min-height:40px}
.trumpchip .tbig{width:30px;height:30px;border-radius:50%;background:var(--whisker);display:grid;place-items:center}
.trumpchip .tbig .suit{width:20px;height:20px}
.trumpchip b{font-size:15px;display:block;line-height:1.1}
.trumpchip small{display:block;font-size:12px;color:var(--fur);font-weight:500;line-height:1.1}
.iconbtn{min-width:44px;height:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;background:var(--burrow-2);font-weight:700;padding:0 10px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block;margin-right:6px}
.dot.warn{background:var(--cheese);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}

.table{position:relative;flex:1;min-height:250px;margin:4px 6px 0}
.felt{position:absolute;left:9%;right:9%;top:11%;bottom:9%;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,#583046,var(--felt) 70%);box-shadow:inset 0 0 0 3px var(--felt-edge),inset 0 10px 30px rgba(0,0,0,.25),0 10px 30px rgba(0,0,0,.25)}
.felt-note{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:#C9A9B8;font-size:13px;width:44%;line-height:1.25;pointer-events:none}
.felt-note b{display:block;font-family:var(--display);font-weight:400;font-size:26px;color:var(--pink);line-height:1.05}
.tu-wrap{display:flex;flex-direction:column;align-items:center;gap:3px;margin-bottom:10px;font-size:12px}
.tu-wrap .card{--cw:36px;transform:rotate(-4deg)}
.seat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:74px;z-index:2}
.seat .av{width:42px;height:42px;border-radius:50%;background:var(--burrow-2);padding:3px;box-shadow:0 0 0 2px var(--felt-edge);position:relative}
.seat.turn .av{box-shadow:0 0 0 3px var(--cheese),0 0 18px 2px rgba(247,197,72,.55);animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 3px var(--cheese),0 0 4px 0 rgba(247,197,72,.2)}}
.seat.off .av{opacity:.45}
.seat .nm{font-size:12.5px;font-weight:700;max-width:74px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;line-height:1.2}
.seat .bw{font-size:12px;color:var(--fur);line-height:1.15;white-space:nowrap}
.seat .bw b{color:var(--whisker)}
.seat .bw.over b{color:var(--pink)}
.dealer{position:absolute;right:-5px;bottom:-3px;width:19px;height:19px;border-radius:50%;background:var(--whisker);color:var(--ink);font-size:11px;font-weight:800;display:grid;place-items:center;box-shadow:0 1px 0 rgba(0,0,0,.4)}
.offtag{font-size:11px;color:var(--cheese);font-weight:700}
.pips{display:flex;gap:2px;justify-content:center;margin-top:2px;min-height:6px}
.pips i{width:6px;height:6px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--fur-dim)}
.pips i.got{background:var(--cheese);box-shadow:none}
.pips i.extra{background:var(--pink);box-shadow:none}
.tcard{position:absolute;transform:translate(-50%,-50%) rotate(var(--rot,0deg));z-index:3;transition:transform .25s}
.tcard .card{--cw:var(--tw)}
.tcard.enter{animation:deal .32s cubic-bezier(.2,.8,.3,1.2) both}
@keyframes deal{from{opacity:0;transform:translate(calc(-50% + var(--fx)),calc(-50% + var(--fy))) scale(.7)}}
.tcard.win .card{filter:drop-shadow(0 0 8px rgba(247,197,72,.95)) drop-shadow(0 0 2px var(--cheese))}
.tcard.collect{animation:collect .5s ease-in .9s both}
@keyframes collect{to{opacity:0;transform:translate(calc(-50% + var(--wx)),calc(-50% + var(--wy))) scale(.6)}}

.me-strip{display:flex;align-items:center;gap:10px;padding:2px 14px 0;flex:none;min-height:34px}
.me-strip .av{width:30px;height:30px;flex:none}
.me-strip .who{font-weight:700}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--burrow-2);border-radius:999px;padding:3px 10px;font-size:14px;font-weight:600}
.chip.dl{background:var(--whisker);color:var(--ink)}
.chip.hit{background:#2E4A39;color:var(--good)}
.me-strip .sp{flex:1}
.status{padding:6px 16px 4px;font-weight:700;font-size:16px;min-height:30px;flex:none;line-height:1.25}
.status.mine{color:var(--cheese)}
.status small{display:block;font-weight:500;color:var(--fur);font-size:13.5px}
.bids{display:flex;flex-wrap:wrap;gap:6px;padding:6px 14px 2px;flex:none;justify-content:center}
.bids button{flex:1 0 34px;max-width:54px;aspect-ratio:1;border-radius:50%;background:var(--whisker);color:var(--ink);font-family:var(--display);font-size:22px;line-height:1;box-shadow:0 3px 0 #C9B7BF;position:relative}
.bids button:active{transform:translateY(2px);box-shadow:0 1px 0 #C9B7BF}
.bids button[disabled]{background:transparent;color:var(--fur-dim);box-shadow:inset 0 0 0 2px var(--felt-edge)}
.bids button[disabled]::after{content:'';position:absolute;left:8px;right:8px;top:50%;height:2px;background:var(--fur-dim);transform:rotate(-35deg)}
.actionrow{display:flex;gap:10px;padding:6px 14px 2px;flex:none;flex-wrap:wrap}
.hand{position:relative;display:flex;justify-content:center;align-items:flex-end;padding:18px 8px calc(10px + var(--safe-b));flex:none;min-height:calc(var(--cw)*1.4 + 32px)}
.hand .hc{padding:0;margin-left:var(--ov,0px);transition:transform .14s ease;position:relative}
.hand .hc:first-child{margin-left:0}
.hand .hc.sel{transform:translateY(-20px)}
.hand .hc.no .card{filter:brightness(.5) saturate(.55) drop-shadow(0 2px 3px rgba(20,8,14,.45))}
.hand .hc.go .card{filter:drop-shadow(0 0 0 transparent) drop-shadow(0 2px 3px rgba(20,8,14,.45))}
.hand.myturn .hc.go:not(.sel) .card{filter:drop-shadow(0 -2px 6px rgba(247,197,72,.35)) drop-shadow(0 2px 3px rgba(20,8,14,.45))}
.hand-empty{color:var(--fur);font-size:14px;align-self:center;padding-bottom:24px}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;background:rgba(22,10,17,.72);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s both}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--burrow);width:100%;max-width:560px;max-height:88dvh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + var(--safe-b));box-shadow:0 -10px 40px rgba(0,0,0,.4);animation:up .24s cubic-bezier(.2,.8,.3,1) both}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{font-family:var(--display);font-weight:400;color:var(--pink);font-size:30px;line-height:1.05;margin:4px 0 4px}
.sheet .sub{color:var(--fur);margin:0 0 14px;font-size:15px}
.sheet-x{float:right;width:44px;height:44px;border-radius:12px;background:var(--burrow-2);font-size:22px;line-height:1}
.results{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-direction:column;gap:6px}
.results li{display:grid;grid-template-columns:22px 34px 1fr auto auto;align-items:center;gap:10px;background:var(--burrow-2);border-radius:14px;padding:7px 12px 7px 10px}
.results .rk{font-weight:800;color:var(--fur);text-align:center}
.results .av{width:34px;height:34px}
.results .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.results .nm small{display:block;font-weight:500;color:var(--fur);font-size:13px}
.results .pt{font-weight:800;font-size:15px;min-width:42px;text-align:right}
.results .pt.made{color:var(--good)}
.results .pt.miss{color:var(--fur-dim)}
.results .tot{font-family:var(--display);font-size:22px;color:var(--cheese);min-width:44px;text-align:right}
.results li.me{box-shadow:inset 0 0 0 2px var(--felt-edge)}
.winner{display:flex;flex-direction:column;align-items:center;text-align:center;margin:4px 0 14px}
.winner .av{width:96px;height:96px;position:relative}
.winner .crown{position:absolute;left:50%;top:-18px;transform:translateX(-50%);width:46px}
.grid-wrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
table.sc{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
table.sc th,table.sc td{padding:5px 4px;text-align:center;white-space:nowrap}
table.sc thead th{position:sticky;top:0;background:var(--burrow)}
table.sc th .av{width:26px;height:26px;margin:0 auto}
table.sc th .n{display:block;font-size:11px;font-weight:600;color:var(--fur);max-width:46px;overflow:hidden;text-overflow:ellipsis}
table.sc td.h{color:var(--fur);text-align:left;font-weight:600}
table.sc td b{display:block;font-size:14px}
table.sc td small{color:var(--fur-dim);font-size:11px}
table.sc td.made b{color:var(--good)}
table.sc td.miss b{color:var(--fur-dim)}
table.sc tfoot td{font-family:var(--display);color:var(--cheese);font-size:17px;border-top:2px solid var(--felt-edge);padding-top:8px}
table.sc tr.cur td{background:var(--burrow-2)}
.menu{display:flex;flex-direction:column;gap:10px}
.menu .btn{width:100%}
.lt{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:6px 0 10px}
.lt figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;font-weight:600;max-width:64px}
.lt figure .card{--cw:56px}
.lt figure.w figcaption{color:var(--cheese)}
.lt figure.w .card{filter:drop-shadow(0 0 6px rgba(247,197,72,.9))}
.qr-big{background:var(--whisker);border-radius:18px;padding:14px;width:min(70vw,260px);margin:6px auto 12px}
.qr-big svg{display:block;width:100%;height:auto}
.banner{margin:4px 14px 0;background:var(--cheese);color:var(--ink);border-radius:14px;padding:8px 10px 8px 14px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;flex:none}
.banner .btn{background:var(--ink);color:var(--whisker);min-height:36px;padding:0 14px;font-size:14px;margin-left:auto}
.banner.soft{background:var(--burrow-2);color:var(--whisker)}

@media (min-height:760px){ :root{--tw:clamp(44px,13vw,60px)} }
@media (max-height:640px){ :root{--cw:clamp(48px,15vw,64px);--tw:38px} .seat .av{width:36px;height:36px} }
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}

</style>

        var b0 = bin.read();

        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;

      }

      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);

  var C = { peer: null, conn: null, lastHeard: 0, lastPing: 0, lastTry: 0, everJoined: false, misses: 0, tick: null, stopped: false };

  function clientStart(code, name) {
    S.mode = 'client'; S.code = code;
    var pk = 'rc:pid:' + code;
    S.pid = store.get(pk) || randStr(12);
    store.set(pk, S.pid);
    S.myName = name;
    C.stopped = false; C.misses = 0;

    render();
  }

  function clientPeer() {

    });

      if (C.peer !== p) return;

        C.misses++;

        if (!C.everJoined && C.misses >= 3) { C.stopped = true; S.net = 'missing'; render(); }
        else { S.net = 'lost'; render(); }
      } else if (e.type === 'browser-incompatible') {
        showFatal('This browser can’t join the game. Try Chrome or Safari.');
      }
    });
  }

  function clientConnect() {

    if (C.conn) { try { C.conn.close(); } catch (e) {} }
    C.lastTry = Date.now();

    conn.on('error', function () { if (C.conn === conn) { C.conn = null; } });

  function clientTick() {

    if (C.peer.disconnected && !(C.conn && C.conn.open)) { try { C.peer.reconnect(); } catch (e) {} return; }

  }

  function clientData(d) {
    if (!d || typeof d !== 'object') return;
    C.lastHeard = Date.now();
    if (d.t === 'pong') { if (S.net !== 'online' && S.view) { S.net = 'online'; render(); } return; }
    if (d.t === 'view') {
      C.everJoined = true; S.net = 'online';
      onView(d.view); return;
    }
    if (d.t === 'err') { toast(d.msg); return; }
    if (d.t === 'fatal') {
      C.stopped = true;
      if (d.code === 'kicked' || d.code === 'started' || d.code === 'full') store.del('rc:pid:' + S.code);
      try { C.conn && C.conn.close(); C.peer && C.peer.destroy(); } catch (e) {}

  }

  function act(a) {
    if (S.mode === 'host') { var e = hostAct(S.pid, a); if (e) toast(e); return; }

  }

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    if (S.view) keepAwake();
    if (S.mode === 'client') { C.lastPing = 0; clientTick(); }
    if (S.mode === 'host') hostTick();
  });

  /* ================= VIEW HANDLING ================= */
  function onView(v) {
    var prev = S.view;
    S.prevView = prev;
    S.view = v;
    if (!v.game) { S.selected = null; }
    else {
      var g = v.game;
      if (S.selected && (g.phase !== 'play' || g.turn !== v.you || g.trickDone || g.hand.indexOf(S.selected) < 0)) S.selected = null;
      var key = g.round + ':' + g.phase + ':' + g.turn + ':' + g.trick.length + ':' + (g.trickDone ? 1 : 0);
      var mine = (g.phase === 'bid' || (g.phase === 'play' && !g.trickDone)) && g.turn === v.you;
      if (mine && S.lastTurnKey !== key) squeak();
      S.lastTurnKey = mine ? key : null;
      if ((g.phase === 'roundEnd' || g.phase === 'over') && prev && prev.game && prev.game.phase === 'play') S.overlay = null;
    }
    render();
  }

  /* ================= RENDERING ================= */
  var appRoot = root;
  function render() {
    var html;
    if (S.screen === 'fatal') html = S.fatalHtml;
    else if (!S.mode) html = S.screen === 'name' ? nameScreen() : homeScreen();
    else if (!S.view) html = waitingScreen();
    else if (S.view.phase === 'lobby') html = lobbyScreen(S.view);
    else html = tableScreen(S.view);
    var ae = document.activeElement, keepId = ae && ae.id && ae.tagName === 'INPUT' ? ae.id : null, selS = keepId ? ae.selectionStart : 0, val = keepId ? ae.value : '';
    appRoot.innerHTML = html + overlayHtml();
    if (keepId) { var el = document.getElementById(keepId); if (el) { el.value = val; el.focus(); try { el.setSelectionRange(selS, selS); } catch (e) {} } }
    afterRender();
  }

  function showFatal(msg) {
    S.screen = 'fatal';
    S.fatalHtml = '<main class="screen"><div class="center">' + Art.ratFace(2, 'peek') +
      '<h2>Off the table</h2><p>' + esc(msg) + '</p>' +
      '<button class="btn btn-cheese" data-a="home">Back to the start</button></div></main>';
    S.mode = null; S.view = null; S.overlay = null;
    render();
  }

  function homeScreen() {
    return '<main class="home">' +
      '<h1 class="title">Rat<span>Contract</span></h1>' +
      '<div class="fan" aria-hidden="true">' + Art.card('JD') + Art.card('KS') + Art.card('QH') + '</div>' +
      '<p class="lede">Contract whist for 3 to 8 players, each on their own phone. Every hand, bid exactly how many tricks you’ll take. Hit it and you score a bonus.</p>' +
      '<div class="stack">' +
        '<button class="btn btn-cheese" data-a="host">Start a game</button>' +
        '<p class="or">Got a code from whoever started it?</p>' +
        '<form class="joinrow" data-f="code"><input id="code" class="field" inputmode="text" autocomplete="off" autocapitalize="characters" maxlength="6" placeholder="Code" aria-label="Game code">' +
        '<button class="btn btn-line" type="submit">Join</button></form>' +
      '</div>' + rulesDetails() +
    '</main>';
  }

  function rulesDetails() {
    return '<details class="rules"><summary>How to play</summary><ol>' +
      '<li>Everyone gets 7 cards, then 6, down to 1, and back up to 7 (you can change this before dealing).</li>' +
      '<li>A card is turned up after the deal. Its suit is trumps for that hand.</li>' +
      '<li>Starting left of the dealer, each player bids how many tricks they’ll win. The dealer bids last and can’t bid the number that makes the bids add up to the cards in hand, so someone always misses.</li>' +
      '<li>Left of the dealer leads. Follow suit if you can. Highest trump wins, otherwise highest card of the suit led. The winner leads next.</li>' +
      '<li>Score 1 per trick, plus 10 if you won exactly what you bid. Most points after the last hand is top rat.</li>' +
    '</ol></details>';
  }

  function nameScreen() {
    var hosting = S.pending && S.pending.host;
    var saved = store.get('rc:name') || '';
    return '<main class="screen">' +
      '<button class="back-link" data-a="home">← Back</button>' +
      '<div style="width:72px;height:72px;margin:10px 0 6px">' + Art.ratFace(hosting ? 0 : 4) + '</div>' +
      '<h2>' + (hosting ? 'Start a game' : 'Join game ' + esc(S.pending.code)) + '</h2>' +
      '<p class="muted">What should everyone call you?</p>' +
      '<form class="stack" data-f="name"><input id="nm" class="field" maxlength="16" autocomplete="nickname" placeholder="Your name" value="' + esc(saved) + '" aria-label="Your name">' +
      '<button class="btn btn-cheese" type="submit">' + (hosting ? 'Open the room' : 'Join the game') + '</button></form>' +
    '</main>';
  }

  function waitingScreen() {
    var msg, sub, btn = '';
    if (S.net === 'missing') {
      msg = 'Can’t find game ' + esc(S.code);
      sub = 'Check the code with whoever started it, and that their phone has the game open.';
      btn = '<button class="btn btn-cheese" data-a="retry">Try again</button><button class="btn btn-line" data-a="home">Back to the start</button>';
    } else {
      msg = S.mode === 'host' ? 'Opening the room…' : 'Finding game ' + esc(S.code) + '…';
      sub = S.mode === 'host' ? 'Getting a code ready for everyone to scan.' : 'Hang on while we reach the host’s phone.';
      btn = '<button class="btn btn-line btn-small" data-a="home">Cancel</button>';
    }
    return '<main class="screen"><div class="center">' + Art.ratFace(5, 'peek') + '<h2>' + msg + '</h2><p class="muted">' + sub + '</p>' + btn + '</div></main>';
  }

  /* ---------- lobby ---------- */
  var PATTERN_LABEL = { downup: 'down to 1, then back up', down: 'down to 1', up: '1 up to ', updown: '1 up to ' };
  function patternText(s) {
    var n = G.schedule(s.startCards, s.pattern).length;
    var t = s.pattern === 'downup' ? s.startCards + ' down to 1, then back up' :
      s.pattern === 'down' ? s.startCards + ' down to 1' :
      s.pattern === 'up' ? '1 up to ' + s.startCards : '1 up to ' + s.startCards + ', then back down';
    return t + ' (' + n + ' hand' + (n === 1 ? '' : 's') + ')';
  }
  function settingsSummary(s) {
    return '<ul class="rules-sum">' +
      '<li>Cards: ' + esc(patternText(s)) + '</li>' +
      '<li>Trumps: ' + (s.trumps === 'turnup' ? 'turn up a card after the deal' : 'rotate ♥ ♣ ♦ ♠ then no trumps') + '</li>' +
      '<li>Dealer’s hook: ' + (s.hook ? 'on, the bids can’t add up' : 'off') + '</li>' +
      '<li>Scoring: ' + (s.scoring === 'bonus' ? '1 per trick, +10 for an exact bid' : '10 + your bid if exact, otherwise 0') + '</li></ul>';
  }

  function lobbyScreen(v) {
    var url = joinUrl(v.code);
    var host = v.isHost, n = v.players.length;
    var o = '<main class="lobby">';
    o += '<div class="lobby-head"><div class="qr">' + qrSvg(url) + '</div><div>' +
      '<div class="muted" style="font-size:14px">Scan to join, or enter code</div>' +
      '<div class="room-code">' + esc(v.code) + '</div>' +
      '<p>' + (location.protocol === 'file:' ? 'Open this page from a web link so other phones can scan in.' : 'Up to ' + G.MAX_PLAYERS + ' players.') + '</p>' +
      '<button class="btn btn-line btn-small" data-a="share">Share link</button></div></div>';
    o += '<h2 class="section-h">Round the table</h2><ul class="plist">';
    v.players.forEach(function (p, i) {
      var me = i === v.you;
      o += '<li class="' + (p.on ? '' : 'off') + '"><div class="av">' + Art.ratFace(p.fur) + '</div>' +
        '<div class="nm">' + esc(p.name) + (me ? '<span class="tag">you</span>' : '') + (p.host ? '<span class="tag">host</span>' : '') + (!p.on ? '<span class="tag">offline</span>' : '') + '</div>';
      if (host) {
        o += '<div class="ctl">' +
          (i > 0 ? '<button data-a="move" data-i="' + i + '" data-d="-1" aria-label="Move ' + esc(p.name) + ' up">↑</button>' : '') +
          (i < n - 1 ? '<button data-a="move" data-i="' + i + '" data-d="1" aria-label="Move ' + esc(p.name) + ' down">↓</button>' : '') +
          (!p.host ? '<button data-a="kick" data-i="' + i + '" aria-label="Remove ' + esc(p.name) + '">×</button>' : '<button data-a="rename" aria-label="Change your name">✎</button>') + '</div>';
      } else if (me) {
        o += '<div class="ctl"><button data-a="rename" aria-label="Change your name">✎</button></div>';
      }
      o += '</li>';
    });
    if (n < MIN_PLAYERS) o += '<li class="empty-seat">Waiting for ' + (MIN_PLAYERS - n) + ' more to join</li>';
    o += '</ul>';
    if (host && n > 1) o += '<p class="muted" style="font-size:14px;margin:8px 2px 0">Play goes down this list, so match it to where people are sitting.</p>';
    o += '<h2 class="section-h">House rules</h2>';
    if (host) o += hostSettings(v); else o += settingsSummary(v.settings);
    o += '</main>';
    if (host) {
      o += '<div class="dock"><button class="btn btn-cheese" data-a="start"' + (n < MIN_PLAYERS ? ' disabled' : '') + '>' +
        (n < MIN_PLAYERS ? 'Need ' + MIN_PLAYERS + ' players to start' : 'Deal the first hand') + '</button></div>';
    } else {
      o += '<div class="dock"><p class="dock-wait">' + Art.ratFace(v.players[v.you].fur, 'mini') + esc(hostName(v)) + ' deals when everyone’s in.</p></div>';
    }
    return o;
  }
  function hostName(v) { for (var i = 0; i < v.players.length; i++) if (v.players[i].host) return v.players[i].name; return 'The host'; }

  function hostSettings(v) {
    var s = v.settings, max = v.maxCards, o = '<div class="settings">';
    var cards = '';
    for (var i = max; i >= 1; i--) cards += '<option value="' + i + '"' + (i === s.startCards ? ' selected' : '') + '>' + i + '</option>';
    o += '<div class="setting"><label for="st-cards">Most cards in a hand</label><select id="st-cards" data-s="startCards">' + cards + '</select></div>';
    o += '<div class="setting"><label for="st-pat">Hands</label><select id="st-pat" data-s="pattern">' +
      ['downup', 'down', 'up', 'updown'].map(function (p) {
        var t = patternText(Object.assign({}, s, { pattern: p }));
        return '<option value="' + p + '"' + (p === s.pattern ? ' selected' : '') + '>' + esc(t) + '</option>';
      }).join('') + '</select></div>';
    o += '<div class="setting"><label for="st-tr">Trumps</label><select id="st-tr" data-s="trumps">' +
      '<option value="turnup"' + (s.trumps === 'turnup' ? ' selected' : '') + '>Turn up a card after the deal</option>' +
      '<option value="rotate"' + (s.trumps === 'rotate' ? ' selected' : '') + '>Rotate ♥ ♣ ♦ ♠, then no trumps</option></select></div>';
    o += '<div class="setting"><div class="toggle"><div><label id="lb-hook">Dealer’s hook</label><div class="hint">The dealer can’t bid the number that makes the bids add up.</div></div>' +
      '<button class="switch" role="switch" aria-labelledby="lb-hook" aria-checked="' + (s.hook ? 'true' : 'false') + '" data-a="hook"></button></div></div>';
    o += '<div class="setting"><label for="st-sc">Scoring</label><select id="st-sc" data-s="scoring">' +
      '<option value="bonus"' + (s.scoring === 'bonus' ? ' selected' : '') + '>1 per trick, +10 for an exact bid</option>' +
      '<option value="exact"' + (s.scoring === 'exact' ? ' selected' : '') + '>10 + your bid if exact, otherwise 0</option></select></div>';
    return o + '</div>';
  }

  /* ---------- table ---------- */
  function nameOf(v, i) { return i === v.you ? 'You' : (v.players[i] ? v.players[i].name : 'Someone'); }
  function seatAngle(k, n) { return (90 + k * 360 / n) * Math.PI / 180; }
  function seatPos(v, i) {
    var n = v.players.length, k = ((i - v.you) % n + n) % n, a = seatAngle(k, n);
    return { a: a, x: 50 + 41 * Math.cos(a), y: 50 + 41 * Math.sin(a), tx: 50 + 23 * Math.cos(a), ty: 50 + 22 * Math.sin(a) };
  }

  function sortHand(hand, trump) {
    var order = ['S', 'H', 'C', 'D'];
    if (trump) { order = order.filter(function (s) { return s !== trump; }); order.push(trump); }
    // keep colours alternating where possible
    var present = order.filter(function (s) { return hand.some(function (c) { return c[1] === s; }); });
    var t = trump && present.indexOf(trump) >= 0 ? present.pop() : null;
    var reds = present.filter(function (s) { return s === 'H' || s === 'D'; }), blacks = present.filter(function (s) { return s === 'S' || s === 'C'; });
    var alt = [], startBlack = blacks.length >= reds.length;
    while (reds.length || blacks.length) {
      var take = (alt.length % 2 === 0) === startBlack ? blacks : reds;
      if (!take.length) take = take === blacks ? reds : blacks;
      alt.push(take.shift());
    }
    if (t) alt.push(t);
    return hand.slice().sort(function (a, b) { return alt.indexOf(a[1]) - alt.indexOf(b[1]) || G.rv(a) - G.rv(b); });
  }

  function bidLine(g) {
    var total = G.bidTotal(g), diff = total - g.cards;
    if (g.bids.some(function (b) { return b == null; })) return 'Bids so far: ' + total + ' for ' + g.cards + ' trick' + (g.cards === 1 ? '' : 's');
    return 'Bids: ' + total + ' for ' + g.cards + ' trick' + (g.cards === 1 ? '' : 's') + (diff === 0 ? ', exactly' : diff > 0 ? ', ' + diff + ' over' : ', ' + (-diff) + ' under');
  }

  function tableScreen(v) {
    var g = v.game, n = v.players.length, me = v.you, o = '';
    var total = g.rounds.length;
    o += '<main class="game">';
    // top bar
    o += '<div class="topbar"><div class="hand-no">Hand ' + Math.min(g.round + 1, total) + ' of ' + total + '<small>' + g.cards + ' card' + (g.cards === 1 ? '' : 's') + ' each</small></div>';
    o += '<div class="trumpchip">' + (g.trump ? '<span class="tbig">' + Art.suitIcon(g.trump) + '</span><div><small>Trumps</small><b>' + cap(Art.SUIT_NAME[g.trump]) + '</b></div>'
      : '<span class="tbig" style="font-weight:800;color:var(--ink)">–</span><div><small>This hand</small><b>No trumps</b></div>') + '</div>';
    o += '<button class="iconbtn" data-a="scores" aria-label="Scores">' + netDot() + (g.scores[me] != null ? g.scores[me] : '') + '</button>';
    o += '<button class="iconbtn" data-a="menu" aria-label="Menu">☰</button></div>';

    // banners
    if (S.net !== 'online') {
      o += '<div class="banner soft"><span class="dot warn"></span>' + (S.mode === 'host' ? 'Reconnecting the room… players already in can keep playing.' : 'Reconnecting to ' + esc(hostName(v)) + '’s phone…') + '</div>';
    }
    if (v.isHost && g.turn != null && (g.phase === 'bid' || g.phase === 'play') && !g.trickDone && g.turn !== me && v.players[g.turn] && !v.players[g.turn].on) {
      o += '<div class="banner">' + esc(v.players[g.turn].name) + ' is offline<button class="btn" data-a="proxy">Play for them</button></div>';
    }

    // table
    o += '<div class="table"><div class="felt"></div>';
    var trickCards = g.trick || [];
    var showTrick = trickCards.length ? trickCards : [];
    var note = '';
    if (!showTrick.length) {
      var bt = G.bidTotal(g), df = bt - g.cards;
      var big = '<b>' + bt + '<span style="font-size:.6em;color:var(--fur)"> for ' + g.cards + '</span></b>';
      if (g.phase === 'bid') note = big + 'bid so far';
      else if (g.phase === 'play') note = big + (df === 0 ? 'bid, exactly' : df > 0 ? 'bid, ' + df + ' over' : 'bid, ' + (-df) + ' under');
      else if (g.phase === 'roundEnd') note = '<b>Hand over</b>';
      else if (g.phase === 'over') note = '<b>Game over</b>';
    }
    if (note) o += '<div class="felt-note">' + (g.turnup && (g.phase === 'bid' || g.phase === 'play') ? '<div class="tu-wrap">' + Art.card(g.turnup, 'tu') + '<span>turned up</span></div>' : '') + note + '</div>';
    for (var i = 0; i < n; i++) {
      if (i === me) continue;
      var p = v.players[i], pos = seatPos(v, i);
      var cls = 'seat' + (g.turn === i && !g.trickDone && (g.phase === 'bid' || g.phase === 'play') ? ' turn' : '') + (p.on ? '' : ' off');
      o += '<div class="' + cls + '" style="left:' + pos.x.toFixed(2) + '%;top:' + pos.y.toFixed(2) + '%">' +
        '<div class="av">' + Art.ratFace(p.fur) + (g.dealer === i ? '<span class="dealer" title="Dealer">D</span>' : '') + '</div>' +
        '<div class="nm">' + esc(p.name) + '</div>' + seatScore(g, i) + (!p.on ? '<div class="offtag">offline</div>' : '') + '</div>';
    }
    var prevLen = S.prevView && S.prevView.game && S.prevView.game.round === g.round ? (S.prevView.game.trick || []).length : 0;
    var prevDone = S.prevView && S.prevView.game && S.prevView.game.trickDone;
    showTrick.forEach(function (t, idx) {
      var pos = seatPos(v, t.seat);
      var rot = ((t.seat * 37 + g.round * 11) % 13) - 6;
      var cls = 'tcard';
      if (idx >= prevLen && !(prevDone && g.trickDone)) cls += ' enter';
      var style = 'left:' + pos.tx.toFixed(2) + '%;top:' + pos.ty.toFixed(2) + '%;--rot:' + rot + 'deg;--fx:' + ((pos.x - pos.tx) * 3).toFixed(0) + 'px;--fy:' + ((pos.y - pos.ty) * 3).toFixed(0) + 'px;';
      if (g.trickDone) {
        var wp = seatPos(v, g.trickDone.winner);
        if (t.seat === g.trickDone.winner) cls += ' win';
        cls += ' collect';
        style += '--wx:' + ((wp.x - pos.tx) * 3.4).toFixed(0) + 'px;--wy:' + ((wp.y - pos.ty) * 3.4).toFixed(0) + 'px;';
      }
      o += '<div class="' + cls + '" style="' + style + '">' + Art.card(t.card) + '</div>';
    });
    o += '</div>';

    // my strip
    var mp = v.players[me];
    o += '<div class="me-strip"><div class="av">' + Art.ratFace(mp.fur) + '</div><span class="who">' + esc(mp.name) + '</span>';
    if (g.dealer === me) o += '<span class="chip dl">Dealer</span>';
    o += '<span class="sp"></span>';
    if (g.bids[me] != null) {
      var hit = g.won[me] === g.bids[me];
      o += '<span class="chip">Bid ' + g.bids[me] + '</span><span class="chip' + (hit ? ' hit' : '') + '">Won ' + g.won[me] + '</span>';
    }
    o += '</div>';

    // status + controls
    o += statusHtml(v);
    o += controlsHtml(v);

    // hand
    var myTurnPlay = g.phase === 'play' && g.turn === me && !g.trickDone;
    var hand = sortHand(v.game.hand || [], g.trump);
    o += '<div class="hand' + (myTurnPlay ? ' myturn' : '') + '" style="--ov:' + overlap(hand.length) + 'px">';
    if (!hand.length) o += '<div class="hand-empty">' + (g.phase === 'roundEnd' || g.phase === 'over' ? 'Hand finished' : 'No cards left') + '</div>';
    hand.forEach(function (c) {
      var legal = myTurnPlay ? v.game.legal.indexOf(c) >= 0 : true;
      var cls = 'hc' + (S.selected === c ? ' sel' : '') + (myTurnPlay ? (legal ? ' go' : ' no') : '');
      o += '<button class="' + cls + '" data-a="card" data-c="' + c + '"' + (myTurnPlay && !legal ? ' aria-disabled="true"' : '') + '>' + Art.card(c) + '</button>';
    });
    o += '</div></main>';
    return o;
  }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function netDot() { return '<span class="dot' + (S.net === 'online' ? '' : ' warn') + '"></span>'; }
  function overlap(count) {
    if (count <= 1) return 0;
    var cw, probe = document.createElement('div'); probe.style.width = 'var(--cw)'; probe.style.position = 'absolute'; probe.style.visibility = 'hidden';
    document.body.appendChild(probe); cw = probe.getBoundingClientRect().width || 64; probe.remove();
    var avail = Math.min(window.innerWidth, 560) - 20;
    var step = Math.min(cw + 6, (avail - cw) / (count - 1));
    return Math.round(step - cw);
  }
  function seatScore(g, i) {
    var b = g.bids[i];
    if (b == null) return '<div class="bw">' + (g.phase === 'bid' && g.turn === i ? 'bidding…' : ' ') + '</div><div class="pips"></div>';
    var w = g.won[i], pips = '';
    var shown = Math.max(b, w);
    if (shown <= 8) for (var k = 0; k < shown; k++) pips += '<i class="' + (k < w ? (k < b ? 'got' : 'extra') : '') + '"></i>';
    return '<div class="bw' + (w > b ? ' over' : '') + '">bid <b>' + b + '</b>, won <b>' + w + '</b></div><div class="pips">' + pips + '</div>';
  }

  function statusHtml(v) {
    var g = v.game, me = v.you, t = '', sub = '', mine = false;
    if (g.phase === 'bid') {
      if (g.turn === me) {
        mine = true; t = 'Your bid. How many tricks will you take?';
        sub = g.forbidden != null ? 'You’re dealing, so you can’t bid ' + g.forbidden + '. ' + bidLine(g) + '.' : bidLine(g) + '.';
      } else { t = nameOf(v, g.turn) + ' is bidding'; sub = bidLine(g) + '.'; }
    } else if (g.phase === 'play') {
      if (g.trickDone) { t = g.trickDone.winner === me ? 'You take the trick' : nameOf(v, g.trickDone.winner) + ' takes the trick'; sub = bidLine(g) + '.'; }
      else if (g.turn === me) {
        mine = true;
        if (!g.trick.length) t = 'Your lead';
        else {
          var led = g.trick[0].card[1];
          t = (g.hand.some(function (c) { return c[1] === led; }) ? 'Your turn. Follow ' + Art.SUIT_NAME[led] : 'Your turn. No ' + Art.SUIT_NAME[led] + ', so play anything');
        }
        sub = S.selected ? 'Tap the raised card again to play it.' : 'Tap a card, then tap it again to play.';
      } else { t = nameOf(v, g.turn) + ' to play'; sub = bidLine(g) + '.'; }
    } else if (g.phase === 'roundEnd') {
      var nd = (g.dealer + 1) % g.n;
      t = 'Hand ' + (g.round + 1) + ' scored';
      sub = nd === me ? 'You deal next.' : nameOf(v, nd) + ' deals next.';
    } else if (g.phase === 'over') { t = 'That’s the game'; sub = 'Open the scores for the full sheet.'; }
    return '<div class="status' + (mine ? ' mine' : '') + '" aria-live="polite">' + esc(t) + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</div>';
  }

  function controlsHtml(v) {
    var g = v.game, me = v.you, o = '';
    if (g.phase === 'bid' && g.turn === me) {
      o += '<div class="bids" role="group" aria-label="Your bid">';
      for (var i = 0; i <= g.cards; i++) {
        var ok = g.legalBids.indexOf(i) >= 0;
        o += '<button data-a="bid" data-n="' + i + '"' + (ok ? '' : ' disabled aria-label="' + i + ', not allowed for the dealer"') + '>' + i + '</button>';
      }
      o += '</div>';
    } else if (g.phase === 'roundEnd') {
      var nd = (g.dealer + 1) % g.n;
      o += '<div class="actionrow">';
      if (nd === me || v.isHost) o += '<button class="btn btn-cheese" style="flex:1" data-a="deal">Deal the next hand (' + g.rounds[g.round + 1] + ' card' + (g.rounds[g.round + 1] === 1 ? '' : 's') + ')</button>';
      o += '<button class="btn btn-line" data-a="summary">Scores</button></div>';
    } else if (g.phase === 'over') {
      o += '<div class="actionrow">' + (v.isHost ? '<button class="btn btn-cheese" style="flex:1" data-a="again">Play again</button>' : '') + '<button class="btn btn-line" style="flex:1" data-a="summary">Final scores</button></div>';
    } else if (g.phase === 'play' && g.lastTrick && !g.trickDone) {
      o += '<div class="actionrow" style="padding-top:0"><button class="btn btn-line btn-small" data-a="last">Last trick</button></div>';
    }
    return o;
  }

  /* ---------- overlays ---------- */
  function overlayHtml() {
    var v = S.view;
    if (S.screen === 'fatal') return '';
    if (v && v.game && (v.game.phase === 'roundEnd' || v.game.phase === 'over') && S.dismissedRound !== v.game.round && !S.overlay) return sheet(summaryHtml(v));
    if (!S.overlay) return '';
    if (S.overlay === 'scores' && v && v.game) return sheet(scoresHtml(v));
    if (S.overlay === 'menu') return sheet(menuHtml(v));
    if (S.overlay === 'qr' && v) return sheet('<button class="sheet-x" data-a="close" aria-label="Close">×</button><h3>Scan to join</h3><p class="sub">Code ' + esc(v.code) + '. Someone who dropped out can rejoin with the same name.</p><div class="qr-big">' + qrSvg(joinUrl(v.code)) + '</div>');
    if (S.overlay === 'last' && v && v.game && v.game.lastTrick) {
      var lt = v.game.lastTrick, o = '<button class="sheet-x" data-a="close" aria-label="Close">×</button><h3>Last trick</h3><p class="sub">' + esc(nameOf(v, lt.winner)) + ' took it.</p><div class="lt">';
      lt.cards.forEach(function (t) { o += '<figure class="' + (t.seat === lt.winner ? 'w' : '') + '">' + Art.card(t.card) + '<figcaption>' + esc(nameOf(v, t.seat)) + '</figcaption></figure>'; });
      return sheet(o + '</div>');
    }
    return '';
  }
  function sheet(inner) { return '<div class="scrim" data-a="scrim"><div class="sheet" role="dialog" aria-modal="true">' + inner + '</div></div>'; }

  function ranking(v) {
    var g = v.game, idx = v.players.map(function (_, i) { return i; });
    idx.sort(function (a, b) { return g.scores[b] - g.scores[a]; });
    var ranks = [], r = 0;
    idx.forEach(function (i, k) { if (k === 0 || g.scores[i] !== g.scores[idx[k - 1]]) r = k + 1; ranks[i] = r; });
    return { order: idx, ranks: ranks };
  }

  function summaryHtml(v) {
    var g = v.game, h = g.history[g.history.length - 1], rk = ranking(v), o = '';
    o += '<button class="sheet-x" data-a="dismiss" aria-label="Close">×</button>';
    if (g.phase === 'over') {
      var top = rk.order.filter(function (i) { return rk.ranks[i] === 1; });
      var w = top[0];
      o += '<div class="winner"><div class="av">' + Art.ratFace(v.players[w].fur) +
        '<svg class="crown" viewBox="0 0 46 30" aria-hidden="true"><path d="M3 28 1 6l11 10L23 1l11 15L45 6l-2 22z" fill="#F2B632" stroke="#8A5A10" stroke-width="1.4"/><circle cx="23" cy="20" r="3" fill="#C42641"/></svg></div>' +
        '<h3>' + (top.length > 1 ? 'Shared top rat' : (w === v.you ? 'You’re top rat' : esc(v.players[w].name) + ' is top rat')) + '</h3>' +
        '<p class="sub">' + (top.length > 1 ? top.map(function (i) { return esc(v.players[i].name); }).join(' and ') + ' tie on ' + g.scores[w] + '.' : g.scores[w] + ' points after ' + g.rounds.length + ' hands.') + '</p></div>';
    } else {
      o += '<h3>Hand ' + (g.round + 1) + ' of ' + g.rounds.length + '</h3><p class="sub">' + h.cards + ' card' + (h.cards === 1 ? '' : 's') + ', ' + (h.trump ? Art.SUIT_NAME[h.trump] + ' trumps' : 'no trumps') + '. Next hand: ' + g.rounds[g.round + 1] + ' card' + (g.rounds[g.round + 1] === 1 ? '' : 's') + '.</p>';
    }
    o += '<ul class="results">';
    rk.order.forEach(function (i) {
      var p = v.players[i], made = h.bids[i] === h.won[i];
      o += '<li class="' + (i === v.you ? 'me' : '') + '"><span class="rk">' + rk.ranks[i] + '</span><div class="av">' + Art.ratFace(p.fur) + '</div>' +
        '<div class="nm">' + esc(i === v.you ? 'You' : p.name) + '<small>bid ' + h.bids[i] + ', won ' + h.won[i] + (made ? ', exact' : '') + '</small></div>' +
        '<span class="pt ' + (made ? 'made' : 'miss') + '">+' + h.pts[i] + '</span><span class="tot">' + g.scores[i] + '</span></li>';
    });
    o += '</ul>';
    if (g.phase === 'roundEnd') {
      var nd = (g.dealer + 1) % g.n;
      if (nd === v.you || v.isHost) o += '<button class="btn btn-cheese" style="width:100%" data-a="deal">Deal the next hand</button>';
      else o += '<button class="btn btn-line" style="width:100%" data-a="dismiss">Back to the table</button><p class="sub" style="text-align:center;margin-top:10px">' + esc(v.players[nd].name) + ' deals next.</p>';
    } else {
      o += '<div class="menu">' + (v.isHost ? '<button class="btn btn-cheese" data-a="again">Play again with the same players</button>' : '') +
        '<button class="btn btn-line" data-a="scores">See every hand</button></div>';
    }
    return o;
  }

  function scoresHtml(v) {
    var g = v.game, o = '<button class="sheet-x" data-a="close" aria-label="Close">×</button><h3>Scores</h3><p class="sub">' +
      (g.settings.scoring === 'bonus' ? '1 per trick, +10 for an exact bid.' : '10 + bid for an exact bid, otherwise 0.') + ' Small numbers are won/bid.</p>';
    o += '<div class="grid-wrap"><table class="sc"><thead><tr><th></th>';
    v.players.forEach(function (p, i) { o += '<th><div class="av">' + Art.ratFace(p.fur) + '</div><span class="n">' + esc(i === v.you ? 'You' : p.name) + '</span></th>'; });
    o += '</tr></thead><tbody>';
    g.rounds.forEach(function (k, r) {
      var h = g.history[r];
      var cur = r === g.round && !h;
      o += '<tr class="' + (cur ? 'cur' : '') + '"><td class="h">' + k + (h ? (h.trump ? ' ' + Art.SUIT_CHAR[h.trump] : '') : (cur && g.trump ? ' ' + Art.SUIT_CHAR[g.trump] : '')) + '</td>';
      v.players.forEach(function (_, i) {
        if (h) o += '<td class="' + (h.bids[i] === h.won[i] ? 'made' : 'miss') + '"><b>' + h.pts[i] + '</b><small>' + h.won[i] + '/' + h.bids[i] + '</small></td>';
        else if (cur && g.bids[i] != null) o += '<td><small>' + g.won[i] + '/' + g.bids[i] + '</small></td>';
        else o += '<td><small>·</small></td>';
      });
      o += '</tr>';
    });
    o += '</tbody><tfoot><tr><td></td>';
    v.players.forEach(function (_, i) { o += '<td>' + g.scores[i] + '</td>'; });
    return o + '</tr></tfoot></table></div>';
  }

  function menuHtml(v) {
    var o = '<button class="sheet-x" data-a="close" aria-label="Close">×</button><h3>Menu</h3><p class="sub">Game ' + esc(S.code || '') + (S.mode === 'host' ? '. Your phone is hosting, so keep this page open.' : '.') + '</p><div class="menu">';
    o += '<button class="btn btn-line" data-a="qr">Show the join code</button>';
    o += '<button class="btn btn-line" data-a="sound">Turn turn alerts ' + (sound ? 'off' : 'on') + '</button>';
    if (v && v.game) o += '<button class="btn btn-line" data-a="scores">Scores</button>';
    if (S.mode === 'host' && v && v.phase === 'game') o += '<button class="btn btn-line" data-a="again">End this game and go back to the lobby</button>';
    if (S.mode === 'host') o += '<button class="btn btn-line" data-a="close-room">Close the room for everyone</button>';
    else o += '<button class="btn btn-line" data-a="leave">Leave this game</button>';
    o += '<details class="rules" style="margin-top:6px">' + rulesDetails().replace('<details class="rules">', '').replace('</details>', '') + '</details>';
    return o + '</div>';
  }

  function afterRender() {
    var h = document.querySelector('.hand');
    if (h) h.scrollLeft = 0;
  }

  /* ================= INPUT ================= */
  root.addEventListener('click', function (e) {
    var el = e.target.closest('[data-a]');
    if (!el) return;
    var a = el.getAttribute('data-a');
    if (a === 'scrim') { if (e.target === el) { if (isSummaryOpen()) S.dismissedRound = S.view.game.round; S.overlay = null; render(); } return; }
    switch (a) {
      case 'home': goHome(); break;
      case 'host': S.pending = { host: true }; S.screen = 'name'; render(); focusLater('nm'); break;
      case 'retry': C.stopped = false; C.misses = 0; S.net = 'connecting'; if (C.tick) clearInterval(C.tick); C.tick = setInterval(clientTick, 1500); clientTick(); render(); break;
      case 'share': shareLink(); break;
      case 'move': act({ type: 'move', seat: +el.dataset.i, dir: +el.dataset.d }); break;
      case 'kick': if (confirm('Remove ' + S.view.players[+el.dataset.i].name + ' from the game?')) act({ type: 'kick', seat: +el.dataset.i }); break;
      case 'rename': var nn = prompt('Your name', S.view.players[S.view.you].name); if (nn && cleanName(nn)) { store.set('rc:name', cleanName(nn)); S.myName = cleanName(nn); act({ type: 'rename', name: nn }); } break;
      case 'hook': act({ type: 'settings', settings: { hook: el.getAttribute('aria-checked') !== 'true' } }); break;
      case 'start': act({ type: 'start' }); break;
      case 'bid': act({ type: 'bid', n: +el.dataset.n }); break;
      case 'card': onCard(el.dataset.c, el); break;
      case 'deal': S.overlay = null; act({ type: 'deal' }); break;
      case 'proxy': act({ type: 'proxy' }); break;
      case 'again': if (S.view.game && S.view.game.phase !== 'over' && !confirm('End this game for everyone and go back to the lobby?')) break; S.overlay = null; act({ type: 'lobby' }); break;
      case 'summary': S.dismissedRound = -1; S.overlay = null; render(); break;
      case 'dismiss': S.dismissedRound = S.view.game.round; S.overlay = null; render(); break;
      case 'scores': S.dismissedRound = S.view && S.view.game ? S.view.game.round : -1; S.overlay = 'scores'; render(); break;
      case 'menu': S.overlay = 'menu'; render(); break;
      case 'qr': S.overlay = 'qr'; render(); break;
      case 'last': S.overlay = 'last'; render(); break;
      case 'close': S.overlay = null; render(); break;
      case 'sound': sound = !sound; store.set('rc:sound', sound ? '1' : '0'); unlockAudio(); if (sound) squeak(); render(); break;
      case 'leave':
        if (!confirm('Leave this game? You can rejoin with the same name while it’s running.')) break;
        if (S.view && S.view.phase === 'lobby') act({ type: 'leave' });
        store.del('rc:pid:' + S.code); setTimeout(goHome, 150); break;
      case 'close-room':
        if (!confirm('Close the room? Everyone will be disconnected and this game will end.')) break;
        Object.keys(H.conns).forEach(function (pid) { send(H.conns[pid].conn, { t: 'fatal', code: 'closed', msg: 'The host closed the room.' }); });
        store.del(hostKey(S.code)); store.del('rc:pid:' + S.code);
        setTimeout(goHome, 300); break;
    }
  });
  function isSummaryOpen() { var v = S.view; return v && v.game && (v.game.phase === 'roundEnd' || v.game.phase === 'over') && S.dismissedRound !== v.game.round && !S.overlay; }

  root.addEventListener('change', function (e) {
    var el = e.target.closest('[data-s]');
    if (!el) return;
    var s = {}; s[el.getAttribute('data-s')] = el.value;
    act({ type: 'settings', settings: s });
  });

  root.addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target.getAttribute('data-f');
    if (f === 'code') {
      var code = cleanCode(document.getElementById('code').value);
      if (code.length < 4) { toast('Enter the code shown on the host’s phone.'); return; }
      beginJoin(code);
    } else if (f === 'name') {
      var nm = cleanName(document.getElementById('nm').value);
      if (!nm) { toast('Enter a name so others know who you are.'); return; }
      store.set('rc:name', nm);
      unlockAudio();
      S.screen = null;
      if (S.pending.host) createRoom(nm);
      else clientStart(S.pending.code, nm);
    }
  });

  function onCard(c, el) {
    var v = S.view, g = v && v.game;
    if (!g || g.phase !== 'play' || g.turn !== v.you || g.trickDone) { wiggle(el); return; }
    if (g.legal.indexOf(c) < 0) { toast('Follow ' + Art.SUIT_NAME[g.trick[0].card[1]] + ' if you can.'); return; }
    if (S.selected === c) { S.selected = null; act({ type: 'play', card: c }); return; }
    S.selected = c;
    var hand = document.querySelectorAll('.hand .hc');
    hand.forEach(function (b) { b.classList.toggle('sel', b.dataset.c === c); });
    var st = document.querySelector('.status small'); if (st) st.textContent = 'Tap the raised card again to play it.';
  }
  function wiggle(el) {
    if (!el || !el.animate) return;
    el.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-4px)' }, { transform: 'translateX(4px)' }, { transform: 'translateX(0)' }], { duration: 220 });
  }
  function focusLater(id) { setTimeout(function () { var el = document.getElementById(id); if (el) el.focus(); }, 60); }

  function shareLink() {
    var url = joinUrl(S.code);
    if (navigator.share) { navigator.share({ title: 'Rat Contract', text: 'Join my game of Rat Contract (code ' + S.code + ')', url: url }).catch(function () {}); return; }
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(function () { toast('Link copied'); }, function () { prompt('Copy this link', url); });
    else prompt('Copy this link', url);
  }

  function goHome() {
    try { if (H.peer) H.peer.destroy(); } catch (e) {}
    try { if (C.peer) C.peer.destroy(); } catch (e) {}
    if (H.tick) clearInterval(H.tick); if (C.tick) clearInterval(C.tick);
    if (H.collectTimer) clearTimeout(H.collectTimer);
    H.peer = null; H.room = null; H.conns = {}; H.collectTimer = null;
    C.peer = null; C.conn = null; C.stopped = true; C.everJoined = false;
    S.mode = null; S.view = null; S.prevView = null; S.code = null; S.screen = null; S.overlay = null; S.pending = null; S.net = 'connecting';
    setUrl(null);
    render();
  }

  function beginJoin(code) {
    var saved = store.get('rc:name');
    if (loadHost(code)) { resumeHost(loadHost(code)); return; }
    if (saved && store.get('rc:pid:' + code)) { clientStart(code, saved); return; }
    S.pending = { host: false, code: code }; S.screen = 'name'; setUrl(code); render(); focusLater('nm');
  }

  /* ================= BOOT ================= */
  document.body.insertAdjacentHTML('afterbegin', Art.SPRITE);
  if (typeof Peer === 'undefined') { showFatal('The game couldn’t load its connection library. Check your internet and reload.'); return; }
  var startCode = cleanCode(params.get('room'));
  if (startCode) beginJoin(startCode); else render();
  window.__rat = { S: S, H: H, C: C, act: act, publish: function () { if (S.mode === 'host') { H.room.v++; saveHost(); publish(); } } };
})();
</script>
</body>
</html>
